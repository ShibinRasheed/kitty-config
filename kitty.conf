# DARK MODE

# ─────────────────────────────────────────────
# 🧁 DARK MODE Base Appearance
# ─────────────────────────────────────────────
foreground               #E5E5E5
background               #121212
selection_foreground     #121212
selection_background     #E5E5E5
cursor                   #E56B2E

# ─────────────────────────────────────────────
# 🎨 Dark MODE Colors
# ─────────────────────────────────────────────


color0  #1a1a1a  
color1  #E84855  
color2  #4CAF50  
color3  #E5A823  
color4  #4F8FBA  
color5  #9A4D9E  
color6  #4CB8B3  
color7  #BFBFBF 

color8  #2a2a2a  
color9  #FF5C67  
color10 #6CD877  
color11 #FFCC5C  
color12 #6BB6E9  
color13 #C679D2  
color14 #5CE6DF  
color15 #E5E5E5 

# ─────────────────────────────────────────────
# 🔤 Font Settings
# ─────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5

# ─────────────────────────────────────────────
# 🎨 Window Appearance
# ─────────────────────────────────────────────
background_opacity 0.80
cursor_shape beam
cursor_blink_interval 0 

border_width 0
window_padding_width 8
hide_window_decorations yes

# ─────────────────────────────────────────────
# ⌨️ Key Bindings
# ─────────────────────────────────────────────
map ctrl+shift+n new_os_window
map ctrl+shift+enter new_window
map ctrl+shift+q close_window
map ctrl+shift+f5 reload_config

# ─────────────────────────────────────────────
# 🧠 Behavior
# ─────────────────────────────────────────────
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0
allow_remote_control yes
shell zsh

